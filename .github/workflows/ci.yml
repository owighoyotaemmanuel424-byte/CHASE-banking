name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: bun test tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Resolves from the committed bun.lock.
      - name: Install dependencies
        run: bun install

      # The suite has no network, database or env requirements: it asserts on the
      # source tree plus the admin gatekeeper and customer session modules.
      - name: Run test suite
        run: bun test tests

  typecheck:
    name: bun tsc --noEmit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      # next-env.d.ts and .next/types are gitignored, so a clean checkout has no
      # generated types at all. This regenerates them (and Next's route type
      # validation files) without paying for a full build.
      - name: Generate Next.js route types
        run: bunx next typegen

      - name: Typecheck
        run: bun tsc --noEmit
