name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: bun test tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Resolves from the committed bun.lock.
      - name: Install dependencies
        run: bun install

      # The suite has no network, database or env requirements: it asserts on the
      # source tree plus the admin/customer auth modules. It does not need the
      # gitignored next-env.d.ts because it never runs the TypeScript compiler.
      - name: Run test suite
        run: bun test tests
